name: Noteri Worker Pool Dedicated Credential
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noteri-worker-pool-credential
  cancel-in-progress: false
env:
  WORKER_POOL_SHA: 21fd68dec6f0da92b3e7da201463401ac5429d64
  RULES_SHA: 4e6091a133f8d7d157abe6f83c31ca597812e0a4
  CORRELATION_ID: noteri-pool-credential-${{ github.run_id }}-${{ github.run_attempt }}
  EVIDENCE_FILE: artifacts/noteri-pool-credential/evidence.json
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  credential:
    if: >-
      github.repository == 'ericson-j-santos/noteri-runtime' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'ericson-j-santos'
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false
      - name: Bootstrap governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules/config/command-gateway.policy.json'
          $launcher = Join-Path $env:GITHUB_WORKSPACE '_rules/scripts/session_launcher.py'
          $argv = @('--policy', $policy, '--repo', $env:GITHUB_WORKSPACE, '--session-prefix', 'noteri-pool-credential', '--correlation-id', $env:CORRELATION_ID, '--expected-head', $env:GITHUB_SHA, '--sync-ref', 'origin/main', '--require-runner-version-preflight')
          $raw = & python3 -B $launcher @argv
          if ($LASTEXITCODE -ne 0 -or -not $raw) { throw 'SESSION_LAUNCH_BLOCKED' }
          $receipt = @($raw)[-1] | ConvertFrom-Json
          if ($receipt.result -ne 'SESSION_LAUNCH_OK' -or $receipt.state_validated -ne $true -or $receipt.head -ne $env:GITHUB_SHA) { throw 'SESSION_LAUNCH_BLOCKED' }
          "worktree=$($receipt.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session=$($receipt.session_id)" | Add-Content $env:GITHUB_OUTPUT
      - name: Qualify current fixed reference
        id: before
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.worktree }}
          SESSION_ID: ${{ steps.session.outputs.session }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rules = Join-Path $env:GITHUB_WORKSPACE '_rules'
          $gateway = Join-Path $rules 'scripts/command_gateway.py'
          $policy = Join-Path $rules 'config/command-gateway.policy.json'
          $argv = @('--policy', $policy, '--correlation-id', $env:CORRELATION_ID, 'run', '--cwd', $env:TARGET_PATH, '--session-id', $env:SESSION_ID, '--risk', '1', '--timeout', '45', '--expected-head', $env:GITHUB_SHA, '--', 'python3', '-B', '-m', 'scripts.noteri_worker_pool_credential_reference')
          $raw = & python3 -B $gateway @argv
          $code = $LASTEXITCODE
          if (-not $raw) { throw 'REFERENCE_PREFLIGHT_MISSING' }
          $envelope = @($raw)[-1] | ConvertFrom-Json
          $probe = $envelope.stdout | ConvertFrom-Json
          if ($envelope.state_changed -ne $false -or $probe.source_sha -ne $env:WORKER_POOL_SHA -or $probe.activated -ne $false -or $probe.token_bytes_read -ne $false) { throw 'REFERENCE_PREFLIGHT_INVALID' }
          if ($probe.result -eq 'BLOCKED_TOKEN_REFERENCE' -and $code -eq 2) {
            'mode=provision' | Add-Content $env:GITHUB_OUTPUT
          } elseif ($probe.result -eq 'REFERENCE_PRIVATE_UNREAD' -and $code -eq 0) {
            'mode=existing' | Add-Content $env:GITHUB_OUTPUT
          } else { throw 'REFERENCE_PREFLIGHT_BLOCKED' }
      - name: Provision dedicated credential through owner Risk3 gateway
        if: steps.before.outputs.mode == 'provision'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.worktree }}
          PYTHONPATH: ${{ steps.session.outputs.worktree }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gateway = Join-Path $env:GITHUB_WORKSPACE '_rules/scripts/owner_risk3_gateway.py'
          $argv = @('--action-id', 'noteri.worker-pool.credential.provision.dev', '--scope', 'repo://noteri-runtime/environment/dev', '--cwd', $env:TARGET_PATH, '--timeout', '90', '--correlation-id', $env:CORRELATION_ID, '--', 'python3', 'scripts/noteri_worker_pool_credential_provision.py', '--confirm', 'PROVISION-NOTERI-WORKER-POOL-CREDENTIAL')
          & python3 -B $gateway @argv
          if ($LASTEXITCODE -ne 0) { throw 'CREDENTIAL_RISK3_BLOCKED' }
      - name: Read back private reference
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.worktree }}
          SESSION_ID: ${{ steps.session.outputs.session }}
          PREFLIGHT_MODE: ${{ steps.before.outputs.mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rules = Join-Path $env:GITHUB_WORKSPACE '_rules'
          $gateway = Join-Path $rules 'scripts/command_gateway.py'
          $policy = Join-Path $rules 'config/command-gateway.policy.json'
          $argv = @('--policy', $policy, '--correlation-id', $env:CORRELATION_ID, 'run', '--cwd', $env:TARGET_PATH, '--session-id', $env:SESSION_ID, '--risk', '1', '--timeout', '45', '--expected-head', $env:GITHUB_SHA, '--', 'python3', '-B', '-m', 'scripts.noteri_worker_pool_credential_reference')
          $raw = & python3 -B $gateway @argv
          if ($LASTEXITCODE -ne 0 -or -not $raw) { throw 'REFERENCE_READBACK_BLOCKED' }
          $envelope = @($raw)[-1] | ConvertFrom-Json
          $probe = $envelope.stdout | ConvertFrom-Json
          if ($envelope.state_changed -ne $false -or $probe.result -ne 'REFERENCE_PRIVATE_UNREAD' -or $probe.private_reference -ne $true -or $probe.token_bytes_read -ne $false -or $probe.activated -ne $false -or $probe.source_sha -ne $env:WORKER_POOL_SHA) { throw 'REFERENCE_READBACK_INVALID' }
          $evidence = [ordered]@{
            schema_version = '1'
            result = 'PRIVATE_REFERENCE_READY'
            preflight_mode = $env:PREFLIGHT_MODE
            source_sha = $env:WORKER_POOL_SHA
            workflow_sha = $env:GITHUB_SHA
            run_id = "$env:GITHUB_RUN_ID"
            state_changed = ($env:PREFLIGHT_MODE -eq 'provision')
            private_reference = $true
            token_bytes_read_by_readback = $false
            credential_value_exposed = $false
            activated = $false
          }
          New-Item -ItemType Directory -Force (Split-Path $env:EVIDENCE_FILE) | Out-Null
          $evidence | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $env:EVIDENCE_FILE -Encoding UTF8
      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-worker-pool-credential-${{ github.run_id }}
          path: artifacts/noteri-pool-credential/evidence.json
          if-no-files-found: warn
          retention-days: 7
  independent-readback:
    needs: credential
    if: needs.credential.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: noteri-worker-pool-credential-${{ github.run_id }}
          path: .tmp/noteri-credential-readback
      - name: Validate receipt bytes and binding
        run: >-
          python3 -B scripts/validate_noteri_worker_pool_credential_artifact.py
          --evidence .tmp/noteri-credential-readback/evidence.json
          --source-sha "$WORKER_POOL_SHA"
          --workflow-sha "${{ github.sha }}"
          --run-id "${{ github.run_id }}"
