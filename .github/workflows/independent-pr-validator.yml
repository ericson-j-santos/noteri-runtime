name: Independent PR Validator

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: independent-pr-validator-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  not_applicable:
    name: Non-PR source / not applicable
    if: github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Record bounded non-PR outcome
        run: >-
          echo "INDEPENDENT_VALIDATOR_NOT_APPLICABLE
          source_event=${{ github.event.workflow_run.event }}
          source_run_id=${{ github.event.workflow_run.id }}"

  producer:
    name: SHA-bound evidence producer
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      receipt_b64: ${{ steps.receipt.outputs.receipt_b64 }}
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
      head_sha: ${{ steps.evidence.outputs.head_sha }}
      main_sha: ${{ steps.evidence.outputs.main_sha }}
      pr_number: ${{ steps.evidence.outputs.pr_number }}
      source_run_id: ${{ steps.evidence.outputs.source_run_id }}
    steps:
      - name: Checkout trusted validator from main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Collect sanitized GitHub evidence
        id: evidence
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const source = context.payload.workflow_run;
            if (!source || source.event !== 'pull_request' || !source.head_sha) {
              core.setFailed('A execução de origem deve ser uma CI de pull_request com HEAD identificável.');
              return;
            }
            const associatedPulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {...context.repo, commit_sha: source.head_sha, per_page: 100},
            );
            const candidates = associatedPulls.filter(pr =>
              pr.state === 'open' && pr.base.ref === 'main' && pr.head.sha === source.head_sha
            );
            if (candidates.length !== 1) {
              core.setFailed(`HEAD da CI deve corresponder a exatamente uma PR aberta para main; encontradas=${candidates.length}.`);
              return;
            }
            const prNumber = candidates[0].number;
            const [{data: pr}, {data: branch}, jobs, files] = await Promise.all([
              github.rest.pulls.get({...context.repo, pull_number: prNumber}),
              github.rest.repos.getBranch({...context.repo, branch: 'main'}),
              github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id: source.id, per_page: 100}),
              github.paginate(github.rest.pulls.listFiles, {...context.repo, pull_number: prNumber, per_page: 100}),
            ]);
            const reviewData = await github.graphql(`
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    reviewThreads(first:100) { nodes { isResolved } pageInfo { hasNextPage } }
                  }
                }
              }`, {...context.repo, number: prNumber});
            const threads = reviewData.repository.pullRequest.reviewThreads;
            if (threads.pageInfo.hasNextPage) {
              core.setFailed('Mais de 100 threads; paginação deliberadamente bloqueada.');
              return;
            }
            const fileFacts = files.map(f => ({filename:f.filename, status:f.status, additions:f.additions, deletions:f.deletions, sha:f.sha})).sort((a,b) => a.filename.localeCompare(b.filename));
            const evidence = {
              schema_version: 1,
              source: 'github_workflow_run_and_api',
              repository: `${context.repo.owner}/${context.repo.repo}`,
              validator_identity: 'github-actions[bot]',
              main_sha: branch.commit.sha,
              workflow_run: {id:source.id, name:source.name, event:source.event, status:source.status, conclusion:source.conclusion, head_sha:source.head_sha},
              pull_request: {number:pr.number, state:pr.state, author:pr.user.login, base_ref:pr.base.ref, base_sha:pr.base.sha, head_sha:pr.head.sha},
              jobs: jobs.map(j => ({name:j.name, head_sha:j.head_sha, status:j.status, conclusion:j.conclusion, steps:(j.steps || []).map(s => ({name:s.name, status:s.status, conclusion:s.conclusion}))})),
              unresolved_review_threads: threads.nodes.filter(t => !t.isResolved).length,
              changed_files: fileFacts.map(f => f.filename),
              diff_digest: crypto.createHash('sha256').update(JSON.stringify(fileFacts)).digest('hex'),
            };
            fs.mkdirSync('_validator', {recursive:true});
            fs.writeFileSync('_validator/evidence.json', JSON.stringify(evidence, null, 2) + '\n');
            core.setOutput('head_sha', source.head_sha);
            core.setOutput('main_sha', branch.commit.sha);
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('source_run_id', String(source.id));

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate exact SHA and required gates
        run: >-
          python scripts/independent_pr_validator.py
          --evidence _validator/evidence.json
          --output _validator/receipt.json
          --expected-repository "${{ github.repository }}"

      - name: Seal sanitized receipt
        id: receipt
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          data = Path('_validator/receipt.json').read_bytes()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('receipt_b64=' + base64.b64encode(data).decode('ascii') + '\n')
              out.write('receipt_sha256=' + hashlib.sha256(data).hexdigest() + '\n')
          PY

  independent_readback:
    name: Independent readback / SHA-bound evidence
    needs: producer
    if: github.event.workflow_run.event == 'pull_request' && needs.producer.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Re-read source and sealed receipt
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          RECEIPT_B64: ${{ needs.producer.outputs.receipt_b64 }}
          RECEIPT_SHA256: ${{ needs.producer.outputs.receipt_sha256 }}
          EXPECTED_HEAD_SHA: ${{ needs.producer.outputs.head_sha }}
          EXPECTED_MAIN_SHA: ${{ needs.producer.outputs.main_sha }}
          PR_NUMBER: ${{ needs.producer.outputs.pr_number }}
          SOURCE_RUN_ID: ${{ needs.producer.outputs.source_run_id }}
        with:
          script: |
            const crypto = require('crypto');
            const raw = Buffer.from(process.env.RECEIPT_B64 || '', 'base64');
            const digest = crypto.createHash('sha256').update(raw).digest('hex');
            if (digest !== process.env.RECEIPT_SHA256) throw new Error('Digest do recibo divergente.');
            const receipt = JSON.parse(raw.toString('utf8'));
            const [{data: run}, {data: pr}, {data: branch}] = await Promise.all([
              github.rest.actions.getWorkflowRun({...context.repo, run_id:Number(process.env.SOURCE_RUN_ID)}),
              github.rest.pulls.get({...context.repo, pull_number:Number(process.env.PR_NUMBER)}),
              github.rest.repos.getBranch({...context.repo, branch:'main'}),
            ]);
            if (receipt.verdict !== 'INDEPENDENT_VALIDATOR_PASSED') throw new Error('Veredito inválido.');
            if (run.status !== 'completed' || run.conclusion !== 'success') throw new Error('CI deixou de estar aprovada.');
            if (run.head_sha !== process.env.EXPECTED_HEAD_SHA || pr.head.sha !== process.env.EXPECTED_HEAD_SHA) throw new Error('HEAD avançou.');
            if (branch.commit.sha !== process.env.EXPECTED_MAIN_SHA || pr.base.sha !== process.env.EXPECTED_MAIN_SHA) throw new Error('Base avançou.');
            if (receipt.head_sha !== process.env.EXPECTED_HEAD_SHA || receipt.base_sha !== process.env.EXPECTED_MAIN_SHA) throw new Error('Recibo não está SHA-bound.');
            core.info(`INDEPENDENT_VALIDATOR_PASSED pr=${pr.number} sha=${receipt.head_sha} run=${run.id}`);
