name: Noteri Command Gateway Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/noteri-command-gateway-refresh'

permissions:
  contents: read

concurrency:
  group: noteri-command-gateway-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 5
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Refresh gateway with fixed contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python3 scripts/noteri_gateway_refresh.py --confirm REFRESH-NOTERI-COMMAND-GATEWAY
      - name: Read back receipt
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'C:\dev\chatgpt-command-gateway\update-receipt.json'
          if (-not (Test-Path -LiteralPath $p)) { throw 'update receipt missing' }
          $r = Get-Content -LiteralPath $p -Raw | ConvertFrom-Json
          if ($r.result -ne 'HOST_UPDATE_OK') { throw 'HOST_UPDATE_OK missing' }
          if ($r.source_commit -ne 'd26351458b17c917100efc3b736dcc6d53a646cb') { throw 'source commit mismatch' }
          if ($r.rules_version -ne '1.6.10') { throw 'rules version mismatch' }
          Write-Host 'NOTERI_GATEWAY_READBACK_OK'
