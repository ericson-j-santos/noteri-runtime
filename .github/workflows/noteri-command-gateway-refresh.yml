name: Noteri Command Gateway Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/noteri-command-gateway-refresh'

permissions:
  contents: read

concurrency:
  group: noteri-command-gateway-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 5
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Refresh gateway with fixed contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python3 scripts/noteri_gateway_refresh.py `
            --confirm REFRESH-NOTERI-COMMAND-GATEWAY `
            --workflow-repository $env:GITHUB_REPOSITORY `
            --workflow-sha $env:GITHUB_SHA `
            --workflow-run-id $env:GITHUB_RUN_ID `
            --workflow-run-attempt $env:GITHUB_RUN_ATTEMPT
          if ($LASTEXITCODE -ne 0) { throw 'NOTERI_GATEWAY_REFRESH_BLOCKED' }
      - name: Independently read back bound receipt and installed hashes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = 'C:\dev\chatgpt-command-gateway'
          $p = Join-Path $installRoot 'update-receipt.json'
          if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw 'update receipt missing' }
          $r = Get-Content -LiteralPath $p -Raw | ConvertFrom-Json
          if ($r.result -ne 'HOST_UPDATE_OK') { throw 'HOST_UPDATE_OK missing' }
          if ($r.host -ne 'Noteri') { throw 'host mismatch' }
          if ($r.source_commit -ne '92e927757c29396228d7c2a04bd3a0ebac21422c') { throw 'source commit mismatch' }
          if ($r.rules_version -ne '1.6.11') { throw 'rules version mismatch' }
          if ($r.validation_head -ne $r.source_commit) { throw 'validation head mismatch' }
          if ($r.install_root -ne $installRoot) { throw 'install root mismatch' }
          if ($r.workflow_repository -ne $env:GITHUB_REPOSITORY -or
              $r.workflow_sha -ne $env:GITHUB_SHA -or
              [string]$r.workflow_run_id -ne $env:GITHUB_RUN_ID -or
              [string]$r.workflow_run_attempt -ne $env:GITHUB_RUN_ATTEMPT) {
            throw 'workflow execution identity mismatch'
          }
          $expectedFiles = @(
            'bin/command_gateway.py',
            'bin/host_health_check.py',
            'bin/session_bootstrap.py',
            'bin/session_preflight.py',
            'bin/session_launcher.py',
            'bin/runner_version_preflight.py',
            'config/policy.json'
          )
          $properties = @($r.files.PSObject.Properties)
          if ($properties.Count -ne $expectedFiles.Count) { throw 'managed file count mismatch' }
          foreach ($relative in $expectedFiles) {
            $property = $r.files.PSObject.Properties[$relative]
            if ($null -eq $property) { throw ('managed file missing: ' + $relative) }
            $target = Join-Path $installRoot ($relative -replace '/', '\')
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw ('installed file missing: ' + $relative)
            }
            $item = Get-Item -LiteralPath $target
            $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $property.Value.sha256 -or
                [int64]$item.Length -ne [int64]$property.Value.size) {
              throw ('installed file hash mismatch: ' + $relative)
            }
          }
          $rollbackManifest = Join-Path ([string]$r.backup_dir) 'rollback-manifest.json'
          if (-not (Test-Path -LiteralPath $rollbackManifest -PathType Leaf)) {
            throw 'rollback snapshot missing'
          }
          Write-Host 'NOTERI_GATEWAY_READBACK_OK'
