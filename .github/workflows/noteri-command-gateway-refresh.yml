name: Noteri Command Gateway Refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only pin inventory or authorized update
        required: true
        default: preflight
        type: choice
        options: [preflight, update, diagnose]
      expected_workflow_sha:
        description: Exact Noteri workflow source commit
        required: true
        type: string
      expected_rules_sha:
        description: Exact approved canonical rules commit
        required: true
        type: string
      expected_legacy_receipt_sha256:
        description: SHA-256 of the original blocked legacy receipt
        required: false
        type: string
      expected_legacy_manifest_sha256:
        description: SHA-256 of the original legacy manifest
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: noteri-command-gateway-refresh
  cancel-in-progress: false

jobs:
  preflight:
    if: github.actor == 'ericson-j-santos' && (inputs.mode == 'preflight' || inputs.mode == 'diagnose')
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 7
    env:
      EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
      EXPECTED_RULES_SHA: ${{ inputs.expected_rules_sha }}
      MODE: ${{ inputs.mode }}
      CORRELATION_ID: noteri-gateway-pins-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact Noteri source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact canonical rules source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: b5ade370fa11877ff7b899b5c6feacc3bfaf34e7
          path: _rules
          persist-credentials: false
      - name: Launch governed read-only session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_SHA -ne $env:EXPECTED_WORKFLOW_SHA -or
              $env:EXPECTED_RULES_SHA -ne 'b5ade370fa11877ff7b899b5c6feacc3bfaf34e7' -or
              $env:COMPUTERNAME -ine 'Noteri' -or
              -not $env:RUNNER_NAME.ToLowerInvariant().StartsWith('noteri')) {
            throw 'NOTERI_GATEWAY_PIN_PREFLIGHT_IDENTITY_INVALID'
          }
          $rules = Join-Path $env:GITHUB_WORKSPACE '_rules'
          $syncRef = 'origin/fix/noteri-gateway-canonical-profile-20261028'
          if ($env:MODE -eq 'diagnose') {
            $syncRef = 'origin/main'
          }
          $args = @('--policy', (Join-Path $rules 'config/command-gateway.policy.json'),
            '--repo', $env:GITHUB_WORKSPACE, '--session-prefix', 'noteri-gateway-pins',
            '--correlation-id', $env:CORRELATION_ID,
            '--expected-head', $env:EXPECTED_WORKFLOW_SHA,
            '--sync-ref', $syncRef,
            '--require-runner-version-preflight')
          $raw = @(& python3 -B (Join-Path $rules 'scripts/session_launcher.py') @args)
          if ($LASTEXITCODE -ne 0 -or -not $raw) { throw 'NOTERI_GATEWAY_PIN_SESSION_BLOCKED' }
          $session = @($raw)[-1] | ConvertFrom-Json
          if ($session.result -ne 'SESSION_LAUNCH_OK' -or
              $session.state_validated -ne $true -or
              $session.head -ne $env:EXPECTED_WORKFLOW_SHA -or
              $session.runner_version_preflight.ok -ne $true) {
            throw 'NOTERI_GATEWAY_PIN_SESSION_INVALID'
          }
          "target=$($session.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session=$($session.session_id)" | Add-Content $env:GITHUB_OUTPUT
      - name: Inventory legacy pins through risk1 Gateway
        if: inputs.mode == 'preflight'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target }}
          SESSION_ID: ${{ steps.session.outputs.session }}
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          $ErrorActionPreference = 'Stop'
          $rules = Join-Path $env:GITHUB_WORKSPACE '_rules'
          $args = @('--policy', (Join-Path $rules 'config/command-gateway.policy.json'),
            '--correlation-id', $env:CORRELATION_ID, 'run', '--cwd', $env:TARGET_PATH,
            '--session-id', $env:SESSION_ID, '--risk', '1', '--timeout', '30',
            '--expected-head', $env:EXPECTED_WORKFLOW_SHA, '--', 'python3', '-B',
            (Join-Path $env:TARGET_PATH 'scripts/noteri_gateway_legacy_pin_inventory.py'))
          $raw = @(& python3 -B (Join-Path $rules 'scripts/command_gateway.py') @args)
          if ($LASTEXITCODE -ne 0 -or -not $raw) { throw 'NOTERI_GATEWAY_PIN_INVENTORY_BLOCKED' }
          $envelope = @($raw)[-1] | ConvertFrom-Json
          if ($envelope.result -ne 'ok' -or $envelope.gateway_exit_code -ne 0 -or
              $envelope.command_exit_code -ne 0 -or $envelope.state_changed -ne $false) {
            throw 'NOTERI_GATEWAY_PIN_GATEWAY_INVALID'
          }
          $report = $envelope.stdout | ConvertFrom-Json
          if ($report.result -ne 'NOTERI_LEGACY_PIN_INVENTORY' -or
              $report.receipt_sha256 -notmatch '^[0-9a-f]{64}$' -or
              $report.manifest_sha256 -notmatch '^[0-9a-f]{64}$' -or
              $report.managed_runtime_changed -ne $false -or
              $report.installation_authorized -ne $false) {
            throw 'NOTERI_GATEWAY_PIN_REPORT_INVALID'
          }
          @{
            result = $report.result
            receipt_sha256 = $report.receipt_sha256
            manifest_sha256 = $report.manifest_sha256
            managed_runtime_changed = $false
            installation_authorized = $false
            workflow_sha = $env:GITHUB_SHA
            rules_sha = $env:EXPECTED_RULES_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'noteri-gateway-pins.json') -Encoding UTF8
          Write-Output 'NOTERI_GATEWAY_PIN_INVENTORY_READONLY_OK'
      - name: Preserve sanitized pin inventory
        if: inputs.mode == 'preflight'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-gateway-pins-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/noteri-gateway-pins.json
          if-no-files-found: error
          retention-days: 7
      - name: Diagnose failure through risk1 Gateway
        if: inputs.mode == 'diagnose'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target }}
          SESSION_ID: ${{ steps.session.outputs.session }}
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          $ErrorActionPreference = 'Stop'
          $rules = Join-Path $env:GITHUB_WORKSPACE '_rules'
          $args = @('--policy', (Join-Path $rules 'config/command-gateway.policy.json'),
            '--correlation-id', $env:CORRELATION_ID, 'run', '--cwd', $env:TARGET_PATH,
            '--session-id', $env:SESSION_ID, '--risk', '1', '--timeout', '30',
            '--expected-head', $env:EXPECTED_WORKFLOW_SHA, '--', 'python3', '-B',
            (Join-Path $env:TARGET_PATH 'scripts/noteri_gateway_failure_readback.py'),
            '--expected-legacy-receipt-sha256', '4a4eaa3e9ca99afa053c371f9974da59c9f867a1f249b36dd79450e841e830bf',
            '--expected-legacy-manifest-sha256', 'f415f09b37ef30ac765f3616810c45bb8b99d018aa3a59b3a1b349aa7c558209')
          $raw = @(& python3 -B (Join-Path $rules 'scripts/command_gateway.py') @args)
          if (-not $raw) { throw 'NOTERI_GATEWAY_FAILURE_GATEWAY_EMPTY' }
          $envelope = @($raw)[-1] | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $envelope.result -ne 'ok' -or
              $envelope.gateway_exit_code -ne 0 -or
              $envelope.command_exit_code -ne 0 -or $envelope.state_changed -ne $false) {
            if ($envelope.stdout) { Write-Output $envelope.stdout }
            throw 'NOTERI_GATEWAY_FAILURE_GATEWAY_BLOCKED'
          }
          $report = $envelope.stdout | ConvertFrom-Json
          if ($report.result -ne 'NOTERI_GATEWAY_FAILURE_READBACK' -or
              $report.managed_runtime_changed_by_readback -ne $false) {
            throw 'NOTERI_GATEWAY_FAILURE_REPORT_INVALID'
          }
          $report | Add-Member -NotePropertyName workflow_sha -NotePropertyValue $env:GITHUB_SHA
          $report | Add-Member -NotePropertyName run_id -NotePropertyValue $env:GITHUB_RUN_ID
          $report | Add-Member -NotePropertyName run_attempt -NotePropertyValue $env:GITHUB_RUN_ATTEMPT
          $report | ConvertTo-Json -Depth 8 -Compress |
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'noteri-gateway-failure-readback.json') -Encoding UTF8
          Write-Output 'NOTERI_GATEWAY_FAILURE_READBACK_OK'
      - name: Preserve sanitized failure readback
        if: inputs.mode == 'diagnose'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-gateway-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/noteri-gateway-failure-readback.json
          if-no-files-found: error
          retention-days: 7

  preflight_readback:
    name: Independent legacy pin artifact and runner readback
    needs: preflight
    if: inputs.mode == 'preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download exact run artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: noteri-gateway-pins-${{ github.run_id }}-${{ github.run_attempt }}
          path: _pin_readback
      - name: Verify producer identity and non-promoting receipt
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          EXPECTED_RULES_SHA: ${{ inputs.expected_rules_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$EXPECTED_RULES_SHA" = 'b5ade370fa11877ff7b899b5c6feacc3bfaf34e7'
          jq -e --arg sha "$GITHUB_SHA" --arg rules "$EXPECTED_RULES_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '(.result == "NOTERI_LEGACY_PIN_INVENTORY") and
             (.workflow_sha == $sha) and (.rules_sha == $rules) and
             (.run_id == $run) and (.run_attempt == $attempt) and
             (.managed_runtime_changed == false) and
             (.installation_authorized == false) and
             (.receipt_sha256 | test("^[0-9a-f]{64}$")) and
             (.manifest_sha256 | test("^[0-9a-f]{64}$"))' \
            _pin_readback/noteri-gateway-pins.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            | jq -e '[.jobs[] | select(.name == "preflight" and
                .conclusion == "success" and
                (.runner_name | ascii_downcase | startswith("noteri")))] | length == 1' >/dev/null
          echo NOTERI_GATEWAY_PIN_INDEPENDENT_READBACK_OK

  diagnose_readback:
    name: Independent Noteri failure readback
    needs: preflight
    if: inputs.mode == 'diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download exact diagnostic artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: noteri-gateway-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: _failure_readback
      - name: Verify producer and read-only contract
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_WORKFLOW_SHA"
          jq -e --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '(.result == "NOTERI_GATEWAY_FAILURE_READBACK") and
             (.workflow_sha == $sha) and (.run_id == $run) and
             (.run_attempt == $attempt) and
             (.managed_runtime_changed_by_readback == false) and
             (.failure_operation | type == "string" and
                test("^[a-z][a-z0-9_]{1,63}$")) and
             ((.failure_os_error | keys | sort) == ["errno", "winerror"]) and
             ((.failure_os_error.errno == null) or
                (.failure_os_error.errno | type == "number")) and
             ((.failure_os_error.winerror == null) or
                (.failure_os_error.winerror | type == "number")) and
             (.receipt_sha256 | test("^[0-9a-f]{64}$")) and
             (.manifest_sha256 | test("^[0-9a-f]{64}$"))' \
            _failure_readback/noteri-gateway-failure-readback.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            | jq -e '[.jobs[] | select(.name == "preflight" and
                .conclusion == "success" and
                (.runner_name | ascii_downcase | startswith("noteri")))] | length == 1' >/dev/null
          echo NOTERI_GATEWAY_FAILURE_INDEPENDENT_READBACK_OK

  refresh:
    if: github.actor == 'ericson-j-santos' && inputs.mode == 'update'
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 5
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Refresh gateway with fixed contract
        shell: powershell
        env:
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          EXPECTED_RULES_SHA: ${{ inputs.expected_rules_sha }}
          EXPECTED_LEGACY_RECEIPT_SHA256: ${{ inputs.expected_legacy_receipt_sha256 }}
          EXPECTED_LEGACY_MANIFEST_SHA256: ${{ inputs.expected_legacy_manifest_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_SHA -ne $env:EXPECTED_WORKFLOW_SHA) {
            throw 'NOTERI_GATEWAY_WORKFLOW_SHA_INVALID'
          }
          if ($env:EXPECTED_RULES_SHA -ne 'b5ade370fa11877ff7b899b5c6feacc3bfaf34e7') {
            throw 'NOTERI_GATEWAY_SOURCE_SHA_INVALID'
          }
          python3 scripts/noteri_gateway_refresh.py `
            --confirm REFRESH-NOTERI-COMMAND-GATEWAY `
            --commit $env:EXPECTED_RULES_SHA `
            --expected-legacy-receipt-sha256 $env:EXPECTED_LEGACY_RECEIPT_SHA256 `
            --expected-legacy-manifest-sha256 $env:EXPECTED_LEGACY_MANIFEST_SHA256 `
            --workflow-repository $env:GITHUB_REPOSITORY `
            --workflow-sha $env:GITHUB_SHA `
            --workflow-run-id $env:GITHUB_RUN_ID `
            --workflow-run-attempt $env:GITHUB_RUN_ATTEMPT
          if ($LASTEXITCODE -ne 0) { throw 'NOTERI_GATEWAY_REFRESH_BLOCKED' }
      - name: Independently read back run evidence and installed hashes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = 'C:\dev\chatgpt-command-gateway'
          function Get-ConfinedRegularFile {
            param(
              [Parameter(Mandatory=$true)][string]$Root,
              [Parameter(Mandatory=$true)][string]$Relative
            )
            $rootItem = Get-Item -LiteralPath $Root -Force
            if (($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw ('reparse root rejected: ' + $Root)
            }
            $rootResolved = (Resolve-Path -LiteralPath $Root).Path.TrimEnd('\')
            $current = $rootResolved
            foreach ($part in ($Relative -split '/')) {
              if ([string]::IsNullOrWhiteSpace($part) -or $part -eq '.' -or $part -eq '..') {
                throw ('invalid relative path: ' + $Relative)
              }
              $current = Join-Path $current $part
              $item = Get-Item -LiteralPath $current -Force
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw ('reparse component rejected: ' + $Relative)
              }
              $resolved = (Resolve-Path -LiteralPath $current).Path
              $prefix = $rootResolved + '\'
              if (-not $resolved.StartsWith(
                    $prefix, [StringComparison]::OrdinalIgnoreCase) -and
                  $resolved -ne $rootResolved) {
                throw ('path escaped root: ' + $Relative)
              }
            }
            if (-not (Test-Path -LiteralPath $current -PathType Leaf)) {
              throw ('regular file missing: ' + $Relative)
            }
            return $current
          }
          $p = Join-Path $installRoot 'refresh-run-receipt.json'
          if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw 'run receipt missing' }
          $r = Get-Content -LiteralPath $p -Raw | ConvertFrom-Json
          $allowed = @(
            'NOTERI_GATEWAY_REFRESHED',
            'NOTERI_GATEWAY_ALREADY_CURRENT_VERIFIED'
          )
          if ($r.result -notin $allowed) { throw 'run result invalid' }
          if ($r.result -eq 'NOTERI_GATEWAY_REFRESHED' -and
              $r.installation_performed_by_run -ne $true) {
            throw 'new installation proof missing'
          }
          if ($r.result -eq 'NOTERI_GATEWAY_ALREADY_CURRENT_VERIFIED' -and
              $r.installation_performed_by_run -ne $false) {
            throw 'old installation was reassigned to current run'
          }
          if ($r.host -ne 'Noteri') { throw 'host mismatch' }
          if ($r.source_commit -ne 'b5ade370fa11877ff7b899b5c6feacc3bfaf34e7') { throw 'source commit mismatch' }
          if ($r.rules_version -ne '1.6.19') { throw 'rules version mismatch' }
          if ($r.noteri_wsl_inventory_profile -ne $true) { throw 'Noteri profile missing' }
          if ($r.validation_head -ne $r.source_commit) { throw 'validation head mismatch' }
          if ($r.install_root -ne $installRoot) { throw 'install root mismatch' }
          if ($r.workflow_repository -ne $env:GITHUB_REPOSITORY -or
              $r.workflow_sha -ne $env:GITHUB_SHA -or
              [string]$r.workflow_run_id -ne $env:GITHUB_RUN_ID -or
              [string]$r.workflow_run_attempt -ne $env:GITHUB_RUN_ATTEMPT) {
            throw 'workflow execution identity mismatch'
          }
          $expectedFiles = @(
            'bin/command_gateway.py',
            'bin/host_health_check.py',
            'bin/session_bootstrap.py',
            'bin/session_preflight.py',
            'bin/session_launcher.py',
            'bin/runner_version_preflight.py',
            'config/policy.json'
          )
          $properties = @($r.files.PSObject.Properties)
          if ($properties.Count -ne $expectedFiles.Count) { throw 'managed file count mismatch' }
          foreach ($relative in $expectedFiles) {
            $property = $r.files.PSObject.Properties[$relative]
            if ($null -eq $property) { throw ('managed file missing: ' + $relative) }
            $target = Get-ConfinedRegularFile -Root $installRoot -Relative $relative
            $item = Get-Item -LiteralPath $target
            $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $property.Value.sha256 -or
                [int64]$item.Length -ne [int64]$property.Value.size) {
              throw ('installed file hash mismatch: ' + $relative)
            }
          }
          $rollbackManifest = Get-ConfinedRegularFile `
            -Root ([string]$r.backup_dir) `
            -Relative 'rollback-manifest.json'
          $rollbackHash = (Get-FileHash -LiteralPath $rollbackManifest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($rollbackHash -ne $r.rollback_manifest_sha256) {
            throw 'rollback manifest changed after verification'
          }
          Write-Host ('NOTERI_GATEWAY_READBACK_OK result=' + $r.result)

