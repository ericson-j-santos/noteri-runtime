name: Noteri Command Gateway Refresh

on:
  workflow_dispatch:
    inputs:
      expected_rules_sha:
        description: Exact approved canonical rules commit
        required: true
        type: string
      expected_legacy_receipt_sha256:
        description: SHA-256 of the original blocked legacy receipt
        required: true
        type: string
      expected_legacy_manifest_sha256:
        description: SHA-256 of the original legacy manifest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: noteri-command-gateway-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 5
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Refresh gateway with fixed contract
        shell: powershell
        env:
          EXPECTED_RULES_SHA: ${{ inputs.expected_rules_sha }}
          EXPECTED_LEGACY_RECEIPT_SHA256: ${{ inputs.expected_legacy_receipt_sha256 }}
          EXPECTED_LEGACY_MANIFEST_SHA256: ${{ inputs.expected_legacy_manifest_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_RULES_SHA -ne 'c98e67cb12d23618d2a2ce19a30ae358637ec59d') {
            throw 'NOTERI_GATEWAY_SOURCE_SHA_INVALID'
          }
          python3 scripts/noteri_gateway_refresh.py `
            --confirm REFRESH-NOTERI-COMMAND-GATEWAY `
            --commit $env:EXPECTED_RULES_SHA `
            --expected-legacy-receipt-sha256 $env:EXPECTED_LEGACY_RECEIPT_SHA256 `
            --expected-legacy-manifest-sha256 $env:EXPECTED_LEGACY_MANIFEST_SHA256 `
            --workflow-repository $env:GITHUB_REPOSITORY `
            --workflow-sha $env:GITHUB_SHA `
            --workflow-run-id $env:GITHUB_RUN_ID `
            --workflow-run-attempt $env:GITHUB_RUN_ATTEMPT
          if ($LASTEXITCODE -ne 0) { throw 'NOTERI_GATEWAY_REFRESH_BLOCKED' }
      - name: Independently read back run evidence and installed hashes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = 'C:\dev\chatgpt-command-gateway'
          function Get-ConfinedRegularFile {
            param(
              [Parameter(Mandatory=$true)][string]$Root,
              [Parameter(Mandatory=$true)][string]$Relative
            )
            $rootItem = Get-Item -LiteralPath $Root -Force
            if (($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw ('reparse root rejected: ' + $Root)
            }
            $rootResolved = (Resolve-Path -LiteralPath $Root).Path.TrimEnd('\')
            $current = $rootResolved
            foreach ($part in ($Relative -split '/')) {
              if ([string]::IsNullOrWhiteSpace($part) -or $part -eq '.' -or $part -eq '..') {
                throw ('invalid relative path: ' + $Relative)
              }
              $current = Join-Path $current $part
              $item = Get-Item -LiteralPath $current -Force
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw ('reparse component rejected: ' + $Relative)
              }
              $resolved = (Resolve-Path -LiteralPath $current).Path
              $prefix = $rootResolved + '\'
              if (-not $resolved.StartsWith(
                    $prefix, [StringComparison]::OrdinalIgnoreCase) -and
                  $resolved -ne $rootResolved) {
                throw ('path escaped root: ' + $Relative)
              }
            }
            if (-not (Test-Path -LiteralPath $current -PathType Leaf)) {
              throw ('regular file missing: ' + $Relative)
            }
            return $current
          }
          $p = Join-Path $installRoot 'refresh-run-receipt.json'
          if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw 'run receipt missing' }
          $r = Get-Content -LiteralPath $p -Raw | ConvertFrom-Json
          $allowed = @(
            'NOTERI_GATEWAY_REFRESHED',
            'NOTERI_GATEWAY_ALREADY_CURRENT_VERIFIED'
          )
          if ($r.result -notin $allowed) { throw 'run result invalid' }
          if ($r.result -eq 'NOTERI_GATEWAY_REFRESHED' -and
              $r.installation_performed_by_run -ne $true) {
            throw 'new installation proof missing'
          }
          if ($r.result -eq 'NOTERI_GATEWAY_ALREADY_CURRENT_VERIFIED' -and
              $r.installation_performed_by_run -ne $false) {
            throw 'old installation was reassigned to current run'
          }
          if ($r.host -ne 'Noteri') { throw 'host mismatch' }
          if ($r.source_commit -ne 'c98e67cb12d23618d2a2ce19a30ae358637ec59d') { throw 'source commit mismatch' }
          if ($r.rules_version -ne '1.6.19') { throw 'rules version mismatch' }
          if ($r.noteri_wsl_inventory_profile -ne $true) { throw 'Noteri profile missing' }
          if ($r.validation_head -ne $r.source_commit) { throw 'validation head mismatch' }
          if ($r.install_root -ne $installRoot) { throw 'install root mismatch' }
          if ($r.workflow_repository -ne $env:GITHUB_REPOSITORY -or
              $r.workflow_sha -ne $env:GITHUB_SHA -or
              [string]$r.workflow_run_id -ne $env:GITHUB_RUN_ID -or
              [string]$r.workflow_run_attempt -ne $env:GITHUB_RUN_ATTEMPT) {
            throw 'workflow execution identity mismatch'
          }
          $expectedFiles = @(
            'bin/command_gateway.py',
            'bin/host_health_check.py',
            'bin/session_bootstrap.py',
            'bin/session_preflight.py',
            'bin/session_launcher.py',
            'bin/runner_version_preflight.py',
            'config/policy.json'
          )
          $properties = @($r.files.PSObject.Properties)
          if ($properties.Count -ne $expectedFiles.Count) { throw 'managed file count mismatch' }
          foreach ($relative in $expectedFiles) {
            $property = $r.files.PSObject.Properties[$relative]
            if ($null -eq $property) { throw ('managed file missing: ' + $relative) }
            $target = Get-ConfinedRegularFile -Root $installRoot -Relative $relative
            $item = Get-Item -LiteralPath $target
            $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $property.Value.sha256 -or
                [int64]$item.Length -ne [int64]$property.Value.size) {
              throw ('installed file hash mismatch: ' + $relative)
            }
          }
          $rollbackManifest = Get-ConfinedRegularFile `
            -Root ([string]$r.backup_dir) `
            -Relative 'rollback-manifest.json'
          $rollbackHash = (Get-FileHash -LiteralPath $rollbackManifest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($rollbackHash -ne $r.rollback_manifest_sha256) {
            throw 'rollback manifest changed after verification'
          }
          Write-Host ('NOTERI_GATEWAY_READBACK_OK result=' + $r.result)

