name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVALUATED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evaluated SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.EVALUATED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$EVALUATED_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 PyYAML==6.0.2
      - name: Run tests
        run: python -m pytest -q

  sql_admin_windows_contract:
    name: SQL admin guard / Win32 contract (not Noteri)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      EVALUATED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact evaluated SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.EVALUATED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: pwsh
        run: |
          $observed = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $observed -ne $env:EVALUATED_SHA) {
            throw 'HEAD_SHA_MISMATCH'
          }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate Windows ACL API and SQL admin guards (no elevation or SQL)
        run: |
          python -m pytest -q tests/test_noteri_sql_admin_bundle_gate.py tests/test_noteri_sql_admin_errorlog_read.py tests/test_noteri_sql_certificate_errorlog.py
