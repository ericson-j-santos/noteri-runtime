name: Noteri Qwen7B existing model qualification (read-only)

on:
  pull_request:
    types: [opened, synchronize, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: noteri-qwen7b-readonly-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Qualify-only contract
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/noteri-qwen7b-verify-only-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Checkout SHA under test
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Strict workflow and negative model contract tests
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2 PyYAML==6.0.2
          python -m compileall -q tests/test_noteri_qwen_verify_only.py scripts/issue8_native_rag_preflight.py
          python -m pytest -q tests/test_noteri_qwen_verify_only.py

  admission:
    name: Read-only owner and SHA admission
    needs: contract
    if: >-
      needs.contract.result == 'success' &&
      github.event.action == 'edited' &&
      github.actor == 'ericson-j-santos' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/noteri-qwen7b-verify-only-20261026' &&
      contains(github.event.pull_request.body, 'OWNER_NOTERI_QWEN7B_20261026_READONLY_ONCE') &&
      github.event.changes.body.from != null &&
      !contains(github.event.changes.body.from, 'OWNER_NOTERI_QWEN7B_20261026_READONLY_ONCE')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      checks: read
      pull-requests: read
      contents: read
    steps:
      - name: Verify exact PR, current main and completed CI
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const event=context.payload.pull_request;
            const [pr,main,rules,files,checks,source]=await Promise.all([
              github.rest.pulls.get({owner,repo,pull_number:event.number}),
              github.rest.repos.getBranch({owner,repo,branch:'main'}),
              github.rest.repos.getBranch({owner,repo:'chatgpt-operational-rules',branch:'main'}),
              github.rest.pulls.listFiles({owner,repo,pull_number:event.number,per_page:100}),
              github.rest.checks.listForRef({owner,repo,ref:event.head.sha,per_page:100}),
              github.rest.repos.getContent({owner,repo,path:'scripts/issue8_native_rag_preflight.py',ref:event.head.sha})
            ]);
            const p=pr.data;
            const marker='OWNER_NOTERI_QWEN7B_20261026_READONLY_ONCE';
            const wanted=new Map([
              ['.github/workflows/noteri-qwen7b-verify-only.yml','added'],
              ['tests/test_noteri_qwen_verify_only.py','added'],
              ['.github/workflows/ci.yml','modified']
            ]);
            const requiredChecks=['tests','SQL admin guard / Win32 contract (not Noteri)'];
            const ci=requiredChecks.every(name=>checks.data.check_runs.some(c=>
              c.name===name && c.head_sha===event.head.sha &&
              c.status==='completed' && c.conclusion==='success' &&
              c.started_at && c.completed_at));
            if (p.state!=='open' || !p.draft || p.user?.login!=='ericson-j-santos' ||
                p.head.repo?.full_name!==owner+'/'+repo ||
                p.head.ref!=='feat/noteri-qwen7b-verify-only-20261026' ||
                p.head.sha!==event.head.sha ||
                p.base.sha!==main.data.commit.sha || p.base.ref!=='main' ||
                rules.data.commit.sha!=='d6af41001bf641727a35a990e7c93b4c757538cb' ||
                source.data.type!=='file' ||
                source.data.sha!=='7135c0fdef65ddf0a7ef637090d18e697453260b' ||
                files.data.length!==3 ||
                !files.data.every(f=>wanted.get(f.filename)===f.status) ||
                !p.body?.includes(marker) || !ci) {
              core.setFailed('NOTERI_MODEL_READONLY_ADMISSION_BLOCKED');return;
            }
            core.info(JSON.stringify({
              result:'NOTERI_QWEN7B_VERIFY_ONLY_ADMITTED',
              pr_head:p.head.sha,main_sha:main.data.commit.sha,
              source_blob_sha:source.data.sha,rules_sha:rules.data.commit.sha
            }));

  physical:
    name: Noteri model store and pinned digest readback
    needs: admission
    if: needs.admission.result == 'success'
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      result_code: ${{ steps.verify.outputs.result_code }}
      digest_prefix: ${{ steps.verify.outputs.digest_prefix }}
      model_bytes: ${{ steps.verify.outputs.model_bytes }}
    env:
      EXPECTED_NOTERI_SHA: ${{ github.event.pull_request.head.sha }}
      RULES_SHA: d6af41001bf641727a35a990e7c93b4c757538cb
      CORRELATION_ID: qwen7b-readonly-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Attest exact Noteri physical runner
        shell: powershell
        run: |
          if ($env:RUNNER_NAME -ne 'Noteri-runtime' -or
              $env:COMPUTERNAME -ne 'Noteri') {
            throw 'NOTERI_MODEL_WRONG_PHYSICAL_RUNNER'
          }
      - name: Checkout exact PR SHA without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_NOTERI_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable canonical Launcher and Gateway
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          persist-credentials: false
      - name: Canonical Session Launcher and runner-version preflight
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $launcher=Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\session_launcher.py'
          $policy=Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $args=@('--policy',$policy,'--repo',$env:GITHUB_WORKSPACE,
            '--session-prefix','noteri-qwen7b-readonly',
            '--correlation-id',$env:CORRELATION_ID,
            '--expected-head',$env:EXPECTED_NOTERI_SHA,
            '--sync-ref','origin/feat/noteri-qwen7b-verify-only-20261026',
            '--require-runner-version-preflight')
          $raw=& python3 -B $launcher @args
          if ($LASTEXITCODE -ne 0 -or -not $raw) {throw 'NOTERI_MODEL_SESSION_FAILED'}
          $s=@($raw)[-1] | ConvertFrom-Json -ErrorAction Stop
          if ($s.result -ne 'SESSION_LAUNCH_OK' -or
              $s.state_validated -ne $true -or
              $s.head -ne $env:EXPECTED_NOTERI_SHA -or
              $s.snapshot_sha256 -notmatch '^[0-9a-f]{64}$' -or
              -not $s.session_id) {throw 'NOTERI_MODEL_SESSION_INVALID'}
          "target=$($s.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "id=$($s.session_id)" | Add-Content $env:GITHUB_OUTPUT
          Write-Output 'NOTERI_MODEL_SESSION_LAUNCH_OK'
      - name: Qualify existing Ollama 7B model without downloads via Risk1
        id: verify
        shell: powershell
        env:
          SESSION_TARGET_PATH: ${{ steps.session.outputs.target }}
          SESSION_ID: ${{ steps.session.outputs.id }}
        run: |
          $ErrorActionPreference='Stop'
          $gateway=Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\command_gateway.py'
          $policy=Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $script=Join-Path $env:SESSION_TARGET_PATH 'scripts\issue8_native_rag_preflight.py'
          $args=@('--policy',$policy,'--correlation-id',$env:CORRELATION_ID,
            'run','--cwd',$env:SESSION_TARGET_PATH,
            '--session-id',$env:SESSION_ID,'--risk','1',
            '--timeout','120','--expected-head',$env:EXPECTED_NOTERI_SHA,
            '--','python3','-B',$script,'--verify-ollama-qwen7b')
          $saved=$ErrorActionPreference
          try {
            $ErrorActionPreference='Continue'
            $raw=& python3 -B $gateway @args 2>&1
            $status=$LASTEXITCODE
          } finally { $ErrorActionPreference=$saved }
          $envelope=$null
          foreach ($line in @($raw)) {
            try {
              $entry=$line.ToString() | ConvertFrom-Json -ErrorAction Stop
              if ($entry.PSObject.Properties.Name -contains 'gateway_exit_code') {
                $envelope=$entry
              }
            } catch {}
          }
          if ($null -eq $envelope) {throw 'NOTERI_MODEL_GATEWAY_RECEIPT_UNAVAILABLE'}
          if ($status -ne 0 -or $envelope.gateway_exit_code -ne 0) {
            $reason='issue8_model_dependency_unavailable'
            if ($envelope.result -eq 'blocked') {
              $reason='issue8_model_gateway_policy_blocked'
            } elseif ($envelope.stdout) {
              try {
                $failure=$envelope.stdout | ConvertFrom-Json -ErrorAction Stop
                if ($failure.result -eq 'ISSUE8_MODEL_SETUP_BLOCKED' -and
                    $failure.reason_code -cmatch '^issue8_[a-z0-9_]{4,96}$') {
                  $reason=$failure.reason_code
                }
              } catch {}
            }
            Write-Output "NOTERI_MODEL_SANITIZED_FAILURE=$reason"
            throw 'NOTERI_MODEL_VERIFY_BLOCKED'
          }
          if ($envelope.state_changed -ne $false) {throw 'NOTERI_MODEL_GIT_STATE_DRIFT'}
          $result=$envelope.stdout | ConvertFrom-Json -ErrorAction Stop
          if ($result.result -ne 'ISSUE8_OLLAMA_QWEN7B_VERIFIED' -or
              $result.mode -ne 'verify' -or
              $result.model_name -ne 'qwen2.5-coder:7b' -or
              $result.digest -cnotmatch '^dae161e27b0e[0-9a-f]{52}$' -or
              $result.size -le 0 -or
              $result.model_state_changed -ne $false -or
              $result.git_state_changed -ne $false) {
            throw 'NOTERI_MODEL_RECEIPT_INVALID'
          }
          "result_code=verified" | Add-Content $env:GITHUB_OUTPUT
          "digest_prefix=$($result.digest.Substring(0,12))" | Add-Content $env:GITHUB_OUTPUT
          "model_bytes=$($result.size)" | Add-Content $env:GITHUB_OUTPUT
          Write-Output 'NOTERI_QWEN7B_MODEL_READONLY_VERIFIED'

  pickup_watchdog:
    name: Qualified Noteri runner pickup watchdog
    needs: admission
    if: needs.admission.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel only current run if no real Noteri pickup in 300s
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const started=Date.now(),limit=300000;
            while(Date.now()-started<limit) {
              const {data}=await github.rest.actions.listJobsForWorkflowRun({
                owner:context.repo.owner,repo:context.repo.repo,
                run_id:context.runId,per_page:100
              });
              const j=data.jobs.find(x=>x.name==='Noteri model store and pinned digest readback');
              if(j && j.runner_name==='Noteri-runtime' && j.runner_id===21 &&
                 (j.status==='in_progress' || j.status==='completed')) {
                core.info('NOTERI_QWEN7B_PHYSICAL_PICKUP_VERIFIED');return;
              }
              await new Promise(resolve=>setTimeout(resolve,15000));
            }
            core.setFailed('NOTERI_MODEL_RUNNER_NO_PICKUP_300S');
            await github.rest.actions.cancelWorkflowRun({
              owner:context.repo.owner,repo:context.repo.repo,
              run_id:context.runId
            });

  independent_readback:
    name: Independent Noteri model gate and source readback
    needs: [admission, physical]
    if: needs.admission.result == 'success' && needs.physical.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check actual runner, executed Gateway steps and immutable code
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          MODEL_RESULT: ${{ needs.physical.outputs.result_code }}
          MODEL_DIGEST_PREFIX: ${{ needs.physical.outputs.digest_prefix }}
          MODEL_BYTES: ${{ needs.physical.outputs.model_bytes }}
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const event=context.payload.pull_request;
            const [jobs,pr,main,rules,source]=await Promise.all([
              github.rest.actions.listJobsForWorkflowRun({
                owner,repo,run_id:context.runId,per_page:100
              }),
              github.rest.pulls.get({owner,repo,pull_number:event.number}),
              github.rest.repos.getBranch({owner,repo,branch:'main'}),
              github.rest.repos.getBranch({owner,repo:'chatgpt-operational-rules',branch:'main'}),
              github.rest.repos.getContent({
                owner,repo,path:'scripts/issue8_native_rag_preflight.py',
                ref:event.head.sha
              })
            ]);
            const job=jobs.data.jobs.find(x=>
              x.name==='Noteri model store and pinned digest readback');
            const steps=[
              'Attest exact Noteri physical runner',
              'Canonical Session Launcher and runner-version preflight',
              'Qualify existing Ollama 7B model without downloads via Risk1'
            ];
            if(!job || job.status!=='completed' || job.conclusion!=='success' ||
               job.runner_name!=='Noteri-runtime' || job.runner_id!==21 ||
               job.head_sha!==event.head.sha ||
               !steps.every(name=>job.steps?.some(s=>
                 s.name===name && s.status==='completed' && s.conclusion==='success')) ||
               pr.data.head.sha!==event.head.sha || !pr.data.draft ||
               pr.data.base.sha!==main.data.commit.sha ||
               rules.data.commit.sha!=='d6af41001bf641727a35a990e7c93b4c757538cb' ||
               source.data.sha!=='7135c0fdef65ddf0a7ef637090d18e697453260b' ||
               process.env.MODEL_RESULT!=='verified' ||
               process.env.MODEL_DIGEST_PREFIX!=='dae161e27b0e' ||
               !/^[0-9]+$/.test(process.env.MODEL_BYTES||'') ||
               Number(process.env.MODEL_BYTES)<1024*1024*1024) {
              core.setFailed('NOTERI_MODEL_INDEPENDENT_READBACK_INVALID');return;
            }
            core.info(JSON.stringify({
              result:'NOTERI_EXISTING_QWEN7B_PHYSICAL_VERIFIED',
              host_job:job.id,runner_id:job.runner_id,
              runtime_sha:event.head.sha,source_blob_sha:source.data.sha,
              model_digest_prefix:process.env.MODEL_DIGEST_PREFIX,
              model_bytes:Number(process.env.MODEL_BYTES),
              model_downloaded:false
            }));
