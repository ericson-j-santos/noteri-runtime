name: Noteri Physical E2E

on:
  push:
    branches: [fix/noteri-watchdog-transactional-upgrade-20261115]
  workflow_dispatch:
    inputs:
      mode:
        description: E2E, inventario ou preflight de upgrade sem modificacao
        required: true
        default: e2e
        type: choice
        options: [e2e, inventory, upgrade-preflight, python-compat]

permissions:
  contents: read

concurrency:
  group: noteri-runtime-physical-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Validate exact noteri-runtime SHA on Noteri
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'e2e'
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 8
    env:
      CORRELATION_ID: noteri-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_FILE: artifacts/noteri-runtime/evidence.json
    steps:
      - name: Checkout immutable source SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable checkout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $observed = (git rev-parse HEAD).Trim()
          if ($observed -ne '${{ github.sha }}') { throw "target_sha_mismatch:$observed" }

      - name: Run isolated physical E2E
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/noteri_runtime_isolated_e2e.py --expected-sha "${{ github.sha }}" --correlation-id "$env:CORRELATION_ID" --evidence-path "$env:EVIDENCE_FILE"

      - name: Validate independent evidence contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $e = Get-Content -Raw -Encoding UTF8 $env:EVIDENCE_FILE | ConvertFrom-Json
          if (-not $e.ok) { throw 'noteri_runtime_e2e_failed' }
          if ($e.host -ne 'Noteri') { throw 'host_mismatch' }
          if ($e.expected_sha -ne '${{ github.sha }}') { throw 'evidence_sha_mismatch' }
          if ($e.observed_sha -ne '${{ github.sha }}') { throw 'observed_sha_mismatch' }
          if (-not $e.source_sha_verified) { throw 'source_sha_not_verified' }
          if ($e.watchdog_installation.installed_attested -ne $true) { throw 'watchdog_not_installed' }
          if ($e.watchdog_installation.source_sha -ne '${{ github.sha }}') { throw 'watchdog_installed_source_sha_mismatch' }
          if ($e.watchdog_installation.installed_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'watchdog_installed_digest_invalid' }
          if ($e.production_touched) { throw 'production_touched' }
          if ($e.secrets_read) { throw 'secrets_read' }
          if ($e.rdc_required) { throw 'rdc_dependency_detected' }
          if ($e.independent_readback.profile -ne 'NORMAL') { throw 'final_profile_not_normal' }
          if (-not $e.independent_readback.idempotent_replay) { throw 'idempotency_missing' }
          if (-not $e.independent_readback.negative_control) { throw 'negative_control_missing' }

      - name: Upload sanitized runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-runtime-e2e-${{ github.run_id }}
          path: artifacts/noteri-runtime/evidence.json
          if-no-files-found: error
          retention-days: 30

  inventory:
    name: Governed Noteri watchdog physical inventory (read only)
    if: github.actor == 'ericson-j-santos' && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'inventory' || inputs.mode == 'upgrade-preflight' || inputs.mode == 'python-compat')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[risk1-inventory-once]') || contains(github.event.head_commit.message, '[risk1-upgrade-preflight-once]') || (contains(github.event.head_commit.message, '[risk1-python-compat-once]') || contains(github.event.head_commit.message, '[risk1-task-python-upgrade-preflight-once]')))))
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 7
    outputs:
      receipt_b64: ${{ steps.inventory.outputs.receipt_b64 }}
      receipt_sha256: ${{ steps.inventory.outputs.receipt_sha256 }}
      preflight_receipt_b64: ${{ steps.upgrade_preflight.outputs.preflight_receipt_b64 }}
      preflight_receipt_sha256: ${{ steps.upgrade_preflight.outputs.preflight_receipt_sha256 }}
      python_receipt_b64: ${{ steps.python_compat.outputs.python_receipt_b64 }}
      python_receipt_sha256: ${{ steps.python_compat.outputs.python_receipt_sha256 }}
    env:
      RULES_SHA: 58dcd4200f412a866278027ba9e433439a03f3b3
      CORRELATION_ID: noteri-watchdog-inventory-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout immutable candidate source SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout canonical rules at pinned current SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: 58dcd4200f412a866278027ba9e433439a03f3b3
          path: _rules
          persist-credentials: false
      - name: Validate host, SHA and governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ine 'Noteri' -or
              -not $env:RUNNER_NAME.ToLowerInvariant().StartsWith('noteri') -or
              (git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA -or
              (git -C _rules rev-parse HEAD).Trim() -ne $env:RULES_SHA) {
            throw 'NOTERI_WATCHDOG_INVENTORY_IDENTITY_BLOCKED'
          }
          $rules = Join-Path $env:GITHUB_WORKSPACE '_rules'
          $args = @('--policy', (Join-Path $rules 'config/command-gateway.policy.json'),
            '--repo', $env:GITHUB_WORKSPACE, '--session-prefix', 'noteri-watchdog-inventory',
            '--correlation-id', $env:CORRELATION_ID,
            '--expected-head', $env:GITHUB_SHA,
            '--sync-ref', 'origin/fix/noteri-watchdog-transactional-upgrade-20261115',
            '--require-runner-version-preflight')
          $raw = @(& python3 -B (Join-Path $rules 'scripts/session_launcher.py') @args)
          if ($LASTEXITCODE -ne 0 -or -not $raw) { throw 'NOTERI_WATCHDOG_SESSION_BLOCKED' }
          $session = @($raw)[-1] | ConvertFrom-Json
          if ($session.result -ne 'SESSION_LAUNCH_OK' -or
              $session.state_validated -ne $true -or
              $session.head -ne $env:GITHUB_SHA -or
              $session.runner_version_preflight.ok -ne $true) {
            throw 'NOTERI_WATCHDOG_SESSION_INVALID'
          }
          "target=$($session.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session=$($session.session_id)" | Add-Content $env:GITHUB_OUTPUT
      - name: Inspect installed release and scheduled task by Risk1 Gateway
        id: inventory
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target }}
          SESSION_ID: ${{ steps.session.outputs.session }}
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          $ErrorActionPreference = 'Stop'
          $rules = Join-Path $env:GITHUB_WORKSPACE '_rules'
          $args = @('--policy', (Join-Path $rules 'config/command-gateway.policy.json'),
            '--correlation-id', $env:CORRELATION_ID,
            'run', '--cwd', $env:TARGET_PATH,
            '--session-id', $env:SESSION_ID, '--risk', '1', '--timeout', '45',
            '--expected-head', $env:GITHUB_SHA, '--',
            'python3', '-B', (Join-Path $env:TARGET_PATH 'scripts/noteri_watchdog_readonly_inventory.py'),
            '--expected-sha', $env:GITHUB_SHA,
            '--correlation-id', $env:CORRELATION_ID,
            '--confirm', 'INVENTORY-NOTERI-WATCHDOG-READONLY')
          $raw = @(& python3 -B (Join-Path $rules 'scripts/command_gateway.py') @args)
          if ($LASTEXITCODE -ne 0 -or -not $raw) { throw 'NOTERI_WATCHDOG_RISK1_GATEWAY_BLOCKED' }
          $envelope = @($raw)[-1] | ConvertFrom-Json
          if ($envelope.result -ne 'ok' -or $envelope.gateway_exit_code -ne 0 -or
              $envelope.command_exit_code -ne 0 -or $envelope.state_changed -ne $false) {
            throw 'NOTERI_WATCHDOG_RISK1_GATEWAY_INVALID'
          }
          $report = $envelope.stdout | ConvertFrom-Json
          if ($report.result -ne 'NOTERI_WATCHDOG_READONLY_INVENTORY' -or
              $report.expected_sha -ne $env:GITHUB_SHA -or
              $report.correlatION_id -ne $env:CORRELATION_ID -or
              $report.source_sha_verified -ne $true -or
              $report.state_changed -ne $false -or
              $report.production_touched -ne $false -or
              $report.installation_authorized -ne $false -or
              $report.ready_for_builder -ne $false -or
              ($report.task_action_verified -eq $true -and
                ($report.installed_release_sha256 -notmatch '^[0-9a-f]{64}$' -or
                 $report.task_definition_sha256 -notmatch '^[0-9a-f]{64}$'))) {
            throw 'NOTERI_WATCHDOG_INVENTORY_RECEIPT_INVALID'
          }
          $report | Add-Member -NotePropertyName source_workflow_sha -NotePropertyValue $env:GITHUB_SHA
          $report | Add-Member -NotePropertyName rules_sha -NotePropertyValue $env:RULES_SHA
          $report | Add-Member -NotePropertyName run_id -NotePropertyValue $env:GITHUB_RUN_ID
          $report | Add-Member -NotePropertyName run_attempt -NotePropertyValue $env:GITHUB_RUN_ATTEMPT
          $json = [string]($report | ConvertTo-Json -Depth 7 -Compress)
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          if ($bytes.Length -gt 8192 -or $bytes.Length -lt 120) {
            throw 'NOTERI_WATCHDOG_INVENTORY_SIZE_INVALID'
          }
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $digest = [System.BitConverter]::ToString($sha.ComputeHash($bytes)).Replace('-', '').ToLowerInvariant()
          } finally { $sha.Dispose() }
          "receipt_b64=$([System.Convert]::ToBase64String($bytes))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          "receipt_sha256=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          Write-Output 'NOTERI_WATCHDOG_RISK1_INVENTORY_COMPLETE_NON_PROMOTING'


      - name: Probe scheduled watchdog Python using existing Risk1 Gateway
        id: python_compat
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'python-compat') || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[risk1-python-compat-once]') || contains(github.event.head_commit.message, '[risk1-task-python-upgrade-preflight-once]')))
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target }}
          SESSION_ID: ${{ steps.session.outputs.session }}
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          $ErrorActionPreference = 'Stop'
          $rules = Join-Path $env:GITHUB_WORKSPACE '_rules'
          $args = @('--policy', (Join-Path $rules 'config/command-gateway.policy.json'),
            '--correlation-id', $env:CORRELATION_ID,
            'run', '--cwd', $env:TARGET_PATH,
            '--session-id', $env:SESSION_ID, '--risk', '1', '--timeout', '60',
            '--expected-head', $env:GITHUB_SHA, '--',
            'python3', '-B', (Join-Path $env:TARGET_PATH 'scripts/noteri_watchdog_python_compat_readonly.py'),
            '--expected-head', $env:GITHUB_SHA,
            '--correlation-id', $env:CORRELATION_ID,
            '--confirm', 'CHECK-NOTERI-TASK-PYTHON-READONLY', '--probe-upgrade')
          $raw = @(& python3 -B (Join-Path $rules 'scripts/command_gateway.py') @args)
          $code = $LASTEXITCODE
          if ($code -ne 0 -or -not $raw) {
            if ($raw) {
              try {
                $reply = @($raw)[-1] | ConvertFrom-Json
                $blocked = $reply.stdout | ConvertFrom-Json
                if ($blocked.result -eq 'BLOCKED' -and $blocked.reason -cmatch '^[A-Z][A-Z0-9_]{3,79}$') {
                  throw "NOTERI_TASK_PYTHON_$($blocked.reason)"
                }
              } catch {
                if ([string]$_.Exception.Message -cmatch '^NOTERI_TASK_PYTHON_[A-Z0-9_]+$') { throw }
              }
            }
            throw 'NOTERI_TASK_PYTHON_GATEWAY_BLOCKED'
          }
          $envelope = @($raw)[-1] | ConvertFrom-Json
          if ($envelope.result -ne 'ok' -or $envelope.gateway_exit_code -ne 0 -or
              $envelope.command_exit_code -ne 0 -or $envelope.state_changed -ne $false) {
            throw 'NOTERI_TASK_PYTHON_GATEWAY_INVALID'
          }
          $result = $envelope.stdout | ConvertFrom-Json
          if ($result.result -notin @('PYWIN32_READY', 'PYWIN32_NOT_IMPORTABLE') -or
              $result.expected_sha -ne $env:GITHUB_SHA -or
              $result.correlation_id -ne $env:CORRELATION_ID -or
              $result.state_changed -ne $false -or
              $result.installation_authorized -ne $false -or
              $result.task_s4u_verified -ne $true -or
              $result.upgrade_preflight -notmatch '^(PREFLIGHT_OK_NOT_AUTHORIZED|SKIPPED_PYWIN32_UNAVAILABLE|NOT_REQUESTED|BLOCKED_[A-Z0-9_]{4,78})$' -or
              $result.task_python_sha256 -notmatch '^[0-9a-f]{64}$' -or
              $result.gateway_python_sha256 -notmatch '^[0-9a-f]{64}$') {
            throw 'NOTERI_TASK_PYTHON_RECEIPT_INVALID'
          }
          $result | Add-Member -NotePropertyName run_id -NotePropertyValue $env:GITHUB_RUN_ID
          $result | Add-Member -NotePropertyName run_attempt -NotePropertyValue $env:GITHUB_RUN_ATTEMPT
          $json = [string]($result | ConvertTo-Json -Depth 6 -Compress)
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          if ($bytes.Length -lt 180 -or $bytes.Length -gt 4096) {
            throw 'NOTERI_TASK_PYTHON_RECEIPT_SIZE_INVALID'
          }
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try { $digest = [System.BitConverter]::ToString($sha.ComputeHash($bytes)).Replace('-', '').ToLowerInvariant() }
          finally { $sha.Dispose() }
          "python_receipt_b64=$([Convert]::ToBase64String($bytes))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          "python_receipt_sha256=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          Write-Output 'NOTERI_TASK_PYTHON_INVENTORY_COMPLETE_NO_INSTALL'

      - name: Preflight exact installed-to-candidate upgrade through existing Risk1 Gateway
        id: upgrade_preflight
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'upgrade-preflight') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[risk1-upgrade-preflight-once]'))
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target }}
          SESSION_ID: ${{ steps.session.outputs.session }}
          INVENTORY_RECEIPT_B64: ${{ steps.inventory.outputs.receipt_b64 }}
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          $ErrorActionPreference = 'Stop'
          $oldSha = 'cc06e6530ca57058db22651ac75d623f6ec921c1'
          $oldDigest = '090728ba5f52360654cacac6bf44366fb6e03c7016ddea763ce62c425c2f76a0'
          $inventory = [System.Text.Encoding]::UTF8.GetString(
            [Convert]::FromBase64String($env:INVENTORY_RECEIPT_B64)) | ConvertFrom-Json
          if ($inventory.installed_source_sha -ne $oldSha -or
              $inventory.installed_release_sha256 -ne $oldDigest -or
              $inventory.task_action_verified -ne $true -or
              $inventory.live_task_s4u -ne $true -or
              $inventory.profile -ne 'NORMAL') {
            throw 'NOTERI_WATCHDOG_UPGRADE_PRECONDITIONS_BLOCKED'
          }
          $source = Join-Path $env:TARGET_PATH 'scripts/noteri_control_plane_watchdog.py'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw 'NOTERI_WATCHDOG_UPGRADE_TARGET_MISSING'
          }
          $targetDigest = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($targetDigest -notmatch '^[0-9a-f]{64}$') {
            throw 'NOTERI_WATCHDOG_UPGRADE_TARGET_DIGEST_INVALID'
          }
          $rules = Join-Path $env:GITHUB_WORKSPACE '_rules'
          $args = @('--policy', (Join-Path $rules 'config/command-gateway.policy.json'),
            '--correlation-id', $env:CORRELATION_ID,
            'run', '--cwd', $env:TARGET_PATH,
            '--session-id', $env:SESSION_ID, '--risk', '1', '--timeout', '45',
            '--expected-head', $env:GITHUB_SHA, '--',
            'python3', '-B', (Join-Path $env:TARGET_PATH 'scripts/noteri_watchdog_transactional_upgrade.py'),
            '--repo-root', $env:TARGET_PATH,
            '--old-sha', $oldSha, '--old-digest', $oldDigest,
            '--target-sha', $env:GITHUB_SHA, '--target-digest', $targetDigest,
            '--correlation-id', $env:CORRELATION_ID, '--mode', 'preflight')
          $raw = @(& python3 -B (Join-Path $rules 'scripts/command_gateway.py') @args)
          $gatewayExit = $LASTEXITCODE
          if (-not $raw) {
            throw 'NOTERI_WATCHDOG_UPGRADE_PREFLIGHT_GATEWAY_EMPTY'
          }
          $envelope = @($raw)[-1] | ConvertFrom-Json
          if ($gatewayExit -ne 0 -or $envelope.result -ne 'ok' -or
              $envelope.gateway_exit_code -ne 0 -or $envelope.command_exit_code -ne 0) {
            # Nunca publicar a saida bruta do Gateway, stderr ou caminhos locais.
            $reason = 'GATEWAY_OR_COMMAND_BLOCKED'
            try {
              $blocked = $envelope.stdout | ConvertFrom-Json
              if ($blocked.result -eq 'BLOCKED' -and
                  $blocked.reason -is [string] -and
                  $blocked.reason -cmatch '^[A-Z][A-Z0-9_]{3,80}$') {
                $reason = $blocked.reason
              }
            } catch { }
            throw "NOTERI_WATCHDOG_UPGRADE_PREFLIGHT_$reason"
          }
          if ($envelope.result -ne 'ok' -or
              $envelope.gateway_exit_code -ne 0 -or
              $envelope.command_exit_code -ne 0 -or
              $envelope.state_changed -ne $false) {
            throw 'NOTERI_WATCHDOG_UPGRADE_PREFLIGHT_GATEWAY_INVALID'
          }
          $report = $envelope.stdout | ConvertFrom-Json
          if ($report.result -ne 'PREFLIGHT_OK_NOT_AUTHORIZED' -or
              $report.state_changed -ne $false -or
              $report.target_sha -ne $env:GITHUB_SHA -or
              $report.old_sha -ne $oldSha) {
            throw 'NOTERI_WATCHDOG_UPGRADE_PREFLIGHT_REPORT_INVALID'
          }
          $receipt = @{
            result = $report.result
            source_workflow_sha = $env:GITHUB_SHA
            rules_sha = $env:RULES_SHA
            old_sha = $oldSha
            old_digest = $oldDigest
            target_sha = $env:GITHUB_SHA
            target_digest = $targetDigest
            profile = $inventory.profile
            task_action_verified = $true
            session_gateway_verified = $true
            state_changed = $false
            installation_authorized = $false
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            correlation_id = $env:CORRELATION_ID
          }
          $json = [string]($receipt | ConvertTo-Json -Compress)
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          if ($bytes.Length -gt 4096 -or $bytes.Length -lt 150) {
            throw 'NOTERI_WATCHDOG_UPGRADE_RECEIPT_SIZE_INVALID'
          }
          $digest = (Get-FileHash -InputStream ([System.IO.MemoryStream]::new($bytes)) -Algorithm SHA256).Hash.ToLowerInvariant()
          "preflight_receipt_b64=$([System.Convert]::ToBase64String($bytes))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          "preflight_receipt_sha256=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          Write-Output 'NOTERI_WATCHDOG_GATEWAY_PREFLIGHT_OK_NO_MUTATION'

  inventory_readback:
    name: Independent GitHub-hosted inventory receipt readback
    needs: inventory
    if: needs.inventory.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      RECEIPT_B64: ${{ needs.inventory.outputs.receipt_b64 }}
      RECEIPT_SHA256: ${{ needs.inventory.outputs.receipt_sha256 }}
      EXPECTED_RULES_SHA: 58dcd4200f412a866278027ba9e433439a03f3b3
    steps:
      - name: Validate digest, source identity and non-promoting receipt
        run: |
          set -euo pipefail
          test -n "$RECEIPT_B64"
          [[ "$RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "${#RECEIPT_B64}" -le 12000
          observed="$(printf '%s' "$RECEIPT_B64" | base64 --decode | sha256sum | cut -d' ' -f1)"
          test "$observed" = "$RECEIPT_SHA256"
          if test "$observed" = "$(printf '%s' tampered | sha256sum | cut -d' ' -f1)"; then
            echo 'TAMPERED_INVENTORY_RECEIPT_ACCEPTED'
            exit 2
          fi
          printf '%s' "$RECEIPT_B64" | base64 --decode | jq -e \
            --arg source "$GITHUB_SHA" --arg rules "$EXPECTED_RULES_SHA" '
            .result == "NOTERI_WATCHDOG_READONLY_INVENTORY" and
            .source_workflow_sha == $source and .expected_sha == $source and
            .rules_sha == $rules and .source_sha_verified == true and
            .state_changed == false and .production_touched == false and
            .installation_authorized == false and .ready_for_builder == false and
            (.task_action_verified == false or
              (.task_action_verified == true and
               (.installed_release_sha256 | test("^[0-9a-f]{64}$")) and
               (.task_definition_sha256 | test("^[0-9a-f]{64}$"))))' >/dev/null
          # Projecao sanitizada para fixar o SHA antigo antes do upgrade.
          # Nunca publicar metadata, XML, caminhos privados ou credenciais.
          printf '%s' "$RECEIPT_B64" | base64 --decode | jq -c '{
            result, correlation_id, expected_sha, installed_source_sha,
            installed_release_sha256, task_definition_sha256, task_action_verified,
            installed_attested, live_task_s4u, profile, blocking_reasons,
            state_changed, production_touched, installation_authorized,
            ready_for_builder
          }'
          echo 'NOTERI_WATCHDOG_INVENTORY_INDEPENDENT_READBACK_OK_NO_INSTALL'

  upgrade_preflight_readback:
    name: Independent non-mutating upgrade-preflight receipt verification
    needs: inventory
    if: needs.inventory.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'upgrade-preflight') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[risk1-upgrade-preflight-once]')))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      PREFLIGHT_B64: ${{ needs.inventory.outputs.preflight_receipt_b64 }}
      PREFLIGHT_SHA256: ${{ needs.inventory.outputs.preflight_receipt_sha256 }}
      EXPECTED_RULES_SHA: 58dcd4200f412a866278027ba9e433439a03f3b3
    steps:
      - name: Verify exact SHA, digest, session and non-authorization
        run: |
          set -euo pipefail
          test -n "$PREFLIGHT_B64"
          [[ "$PREFLIGHT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "${#PREFLIGHT_B64}" -le 8192
          observed="$(printf '%s' "$PREFLIGHT_B64" | base64 --decode | sha256sum | cut -d' ' -f1)"
          test "$observed" = "$PREFLIGHT_SHA256"
          printf '%s' "$PREFLIGHT_B64" | base64 --decode | jq -e \
            --arg source "$GITHUB_SHA" \
            --arg rules "$EXPECTED_RULES_SHA" \
            --arg old "cc06e6530ca57058db22651ac75d623f6ec921c1" \
            --arg olddigest "090728ba5f52360654cacac6bf44366fb6e03c7016ddea763ce62c425c2f76a0" '
            .result == "PREFLIGHT_OK_NOT_AUTHORIZED" and
            .source_workflow_sha == $source and
            .rules_sha == $rules and
            .target_sha == $source and
            .old_sha == $old and
            .old_digest == $olddigest and
            (.target_digest | test("^[0-9a-f]{64}$")) and
            .profile == "NORMAL" and
            .task_action_verified == true and
            .session_gateway_verified == true and
            .state_changed == false and
            .installation_authorized == false and
            (.run_id | tostring) == env.GITHUB_RUN_ID and
            (.run_attempt | tostring) == env.GITHUB_RUN_ATTEMPT' >/dev/null
          echo 'NOTERI_WATCHDOG_UPGRADE_PREFLIGHT_INDEPENDENT_READBACK_OK_NO_INSTALL'

  python_compat_readback:
    name: Independent Python compatibility receipt check
    needs: inventory
    if: needs.inventory.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'python-compat') || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[risk1-python-compat-once]') || contains(github.event.head_commit.message, '[risk1-task-python-upgrade-preflight-once]'))))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      RECEIPT_B64: ${{ needs.inventory.outputs.python_receipt_b64 }}
      RECEIPT_SHA256: ${{ needs.inventory.outputs.python_receipt_sha256 }}
    steps:
      - name: Verify source SHA, receipt digest and non-mutation
        run: |
          set -euo pipefail
          test -n "$RECEIPT_B64"
          [[ "$RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(printf %s "$RECEIPT_B64" | wc -c)" -le 8192
          observed="$(printf %s "$RECEIPT_B64" | base64 --decode | sha256sum | cut -d' ' -f1)"
          test "$observed" = "$RECEIPT_SHA256"
          printf %s "$RECEIPT_B64" | base64 --decode | jq -e \
            --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '
              .schema == 1 and .expected_sha == $source and
              .result == (if .task_pywin32_importable then "PYWIN32_READY" else "PYWIN32_NOT_IMPORTABLE" end) and
              (.task_pywin32_importable | type) == "boolean" and
              (.gateway_pywin32_importable | type) == "boolean" and
              (.same_interpreter | type) == "boolean" and
              (.upgrade_preflight | type) == "string" and
              (.upgrade_preflight | test("^(PREFLIGHT_OK_NOT_AUTHORIZED|SKIPPED_PYWIN32_UNAVAILABLE|NOT_REQUESTED|BLOCKED_[A-Z0-9_]{4,78})$")) and
              (.task_sha256 | test("^[0-9a-f]{64}$")) and
              (.task_python_sha256 | test("^[0-9a-f]{64}$")) and
              (.gateway_python_sha256 | test("^[0-9a-f]{64}$")) and
              .task_s4u_verified == true and
              .state_changed == false and .installation_authorized == false and
              .production_touched == false and
              .run_id == $run and .run_attempt == $attempt' >/dev/null
          printf %s "$RECEIPT_B64" | base64 --decode | jq -c '{
            result, profile, task_pywin32_importable, gateway_pywin32_importable,
            same_interpreter, upgrade_preflight, task_python_sha256, gateway_python_sha256,
            state_changed, installation_authorized
          }'
          echo NOTERI_PYTHON_COMPAT_INDEPENDENT_READBACK_OK
