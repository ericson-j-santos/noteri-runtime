name: Noteri Physical E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/physical-e2e.yml'
      - 'scripts/noteri_runtime_isolated_e2e.py'
      - 'scripts/noteri_host_profile_agent.py'
      - 'scripts/noteri_host_profile_agent_control.py'
      - 'scripts/noteri_host_profile_agent_persistence.py'

permissions:
  contents: read

concurrency:
  group: noteri-runtime-physical-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Validate exact noteri-runtime SHA on Noteri
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 8
    env:
      CORRELATION_ID: noteri-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_FILE: artifacts/noteri-runtime/evidence.json
    steps:
      - name: Checkout immutable source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable checkout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $observed = (git rev-parse HEAD).Trim()
          if ($observed -ne '${{ github.sha }}') { throw "target_sha_mismatch:$observed" }

      - name: Run isolated physical E2E
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/noteri_runtime_isolated_e2e.py --expected-sha "${{ github.sha }}" --correlation-id "$env:CORRELATION_ID" --evidence-path "$env:EVIDENCE_FILE"

      - name: Validate independent evidence contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $e = Get-Content -Raw -Encoding UTF8 $env:EVIDENCE_FILE | ConvertFrom-Json
          if (-not $e.ok) { throw 'noteri_runtime_e2e_failed' }
          if ($e.host -ne 'Noteri') { throw 'host_mismatch' }
          if ($e.expected_sha -ne '${{ github.sha }}') { throw 'evidence_sha_mismatch' }
          if ($e.production_touched) { throw 'production_touched' }
          if ($e.secrets_read) { throw 'secrets_read' }
          if ($e.rdc_required) { throw 'rdc_dependency_detected' }
          if ($e.independent_readback.profile -ne 'NORMAL') { throw 'final_profile_not_normal' }
          if (-not $e.independent_readback.idempotent_replay) { throw 'idempotency_missing' }
          if (-not $e.independent_readback.negative_control) { throw 'negative_control_missing' }

      - name: Upload sanitized runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-runtime-e2e-${{ github.run_id }}
          path: artifacts/noteri-runtime/evidence.json
          if-no-files-found: error
          retention-days: 30
